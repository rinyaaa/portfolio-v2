name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Dependabot(pull_requestイベント)にはrepository secretsが渡らない(forkと同じ扱い)ため、
      # microCMSを叩くbuildはpushイベント(=main反映後)でのみ実行する。PRでは依存解決・テストまでを見る。
      - run: npm run build
        if: github.event_name == 'push'
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      - run: npm audit --audit-level=high
        continue-on-error: true # 既知の15件はビルドツール(astro/wrangler等)側の依存で上流修正待ち。ブラウザ配信コードではないためブロックしない。project-health-checkで定期確認する

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact -v
